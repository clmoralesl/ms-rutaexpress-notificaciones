server.port=8083
spring.application.name=ms-rutaexpress-notificaciones

# RabbitMQ en pruebas
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Topologia RabbitMQ (Issue #99)
rutaexpress.mensajeria.cola-principal.ttl-ms=86400000
rutaexpress.mensajeria.cola-principal.largo-maximo=10000
rutaexpress.mensajeria.cola-dlq.ttl-ms=604800000
rutaexpress.mensajeria.cola-dlq.largo-maximo=50000

# ===== Reintentos con cola de espera (Issue #106) =====
rutaexpress.mensajeria.reintentos.maximo=3
rutaexpress.mensajeria.reintentos.espera-ms=10000
rutaexpress.mensajeria.reintentos.tiempo-confirmacion-ms=5000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
