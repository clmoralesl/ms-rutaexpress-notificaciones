server.port=8083
spring.application.name=ms-rutaexpress-notificaciones

# ===== RabbitMQ Connection =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ===== RabbitMQ Listener Manual Acknowledgment =====
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# ===== Topologia RabbitMQ (Issue #99). Cambiar un valor obliga a recrear las colas: ver infra/mq/README.md =====
rutaexpress.mensajeria.cola-principal.ttl-ms=86400000
rutaexpress.mensajeria.cola-principal.largo-maximo=10000
rutaexpress.mensajeria.cola-dlq.ttl-ms=604800000
rutaexpress.mensajeria.cola-dlq.largo-maximo=50000

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
